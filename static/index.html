<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vorlichtern">
<meta name="theme-color" content="#151a2b">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Vorlichtern</title>
<style>
  /* Lokal ausgeliefert, damit die Seite nur mit dem Heimnetz auskommt (ADR 0002) */
  @font-face {
    font-family: "Literata";
    src: url("/static/fonts/literata-latin-opsz-normal.woff2") format("woff2");
    font-weight: 200 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --night: #151a2b;
    --dusk: #1e2540;
    --lamp: #e6b46e;
    --lamp-dim: #9c7a4c;
    --mist: #7f86a3;
    --warn: #d88c8c;
    --line: #2c3456;
    --serif: "Literata", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night); color: var(--lamp); font-family: var(--serif);
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--lamp-dim); outline-offset: 4px; }
  button:disabled { color: var(--line); cursor: default; }
  input:not([type=checkbox]) {
    font: inherit; color: inherit; background: var(--dusk); border: 0; border-radius: 8px;
    padding: .55rem .75rem; -webkit-user-select: text; user-select: text;
  }
  input::placeholder { color: var(--mist); }
  input:focus-visible { outline: 2px solid var(--lamp-dim); outline-offset: 2px; }
  input[type=checkbox] { width: 1.15rem; height: 1.15rem; margin: 0; accent-color: var(--lamp); }
  .problems {
    list-style: none; margin: 0; padding: 0; font-size: .9rem; line-height: 1.4; color: var(--warn);
    -webkit-user-select: text; user-select: text;   /* zum Kopieren beim Korrigieren */
  }
  .problems li + li { margin-top: .35rem; }
  .error { flex-basis: 100%; min-height: 1.3em; margin: 0; font-size: .9rem; color: var(--warn); }
  [hidden] { display: none !important; }
  #next:focus-visible { outline: none; } /* ganze Fläche ist die Taste */

  /* Buchauswahl */
  #shelf { max-width: 36rem; margin: 0 auto; padding: 3rem 1.5rem; }
  #shelf h1 { font-weight: 400; font-size: 1.1rem; color: var(--mist); margin: 0 0 1.5rem; }
  .entry {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    border-bottom: 1px solid var(--dusk);
  }
  .book {
    text-align: left; padding: 1.1rem 0;
    font-size: 1.6rem; line-height: 1.25;
  }
  .book:disabled { color: var(--mist); }
  .book small { display: block; font-size: .9rem; color: var(--mist); margin-top: .25rem; }
  .entry .edit { font-size: .95rem; color: var(--mist); padding: .75rem 0 .75rem 1rem; }
  .entry .problems { grid-column: 1 / -1; margin: -.5rem 0 1.1rem; }
  #addBook { font-size: 1.2rem; color: var(--mist); padding: 1.1rem 0; }
  #connectApp { display: block; font-size: 1.05rem; color: var(--mist); padding: .25rem 0 1.1rem; }
  #newBookForm { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: 1rem 0 0; }
  #newTitle { flex: 1; min-width: 12rem; font-size: 1.2rem; }
  #cancelBook { color: var(--mist); }
  .hint { color: var(--mist); font-size: .95rem; line-height: 1.5; margin-top: 2rem; }

  /* Editor */
  #editor { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1.25rem 8rem; }
  #edTop { display: flex; flex-wrap: wrap; align-items: center; gap: 0 1rem; }
  #edTitle {
    flex: 1; min-width: 0; font-size: 1.6rem; background: none; border-radius: 0;
    padding: .4rem 0; border-bottom: 1px solid var(--dusk);
  }
  #edStatus { font-size: .85rem; color: var(--mist); text-align: right; }
  #edStatus.warn { order: 1; flex-basis: 100%; padding-top: .5rem; text-align: left; color: var(--warn); }
  #edStatus button { color: var(--lamp); padding: .25rem 0 .25rem .5rem; }
  #edDone { font-size: 1.05rem; padding: .5rem 0 .5rem .5rem; }
  #edRoom { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem; margin: .9rem 0 0; }
  #edRoom > span { font-size: .85rem; color: var(--mist); }
  #bookProblems { margin: .75rem 0 0; }
  #moments { list-style: none; margin: .5rem 0 0; padding: 0; }
  .moment { border-bottom: 1px solid var(--dusk); }
  .moment .head { display: flex; gap: .75rem; width: 100%; text-align: left; padding: .9rem 0; }
  .num { min-width: 1.5rem; font-size: .9rem; color: var(--mist); }
  .head .num { padding-top: .2rem; }
  .head .text { flex: 1; min-width: 0; font-size: 1.15rem; line-height: 1.3; }
  .head small { display: block; margin-top: .2rem; font-size: .85rem; color: var(--mist); }
  .head .count, .unnamed { color: var(--warn); }
  .moment.open { background: var(--dusk); border: 0; border-radius: 10px; padding: .75rem 1rem 1rem; margin: .5rem 0; }
  .labelRow { display: flex; align-items: center; gap: .75rem; }
  .open .labelInput { flex: 1; min-width: 0; font-size: 1.2rem; background: var(--night); }
  .labelInput.empty::placeholder { color: var(--warn); }
  .field { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem; margin: .6rem 0 0 2.25rem; }
  .field > span { width: 4.5rem; font-size: .85rem; color: var(--mist); }
  .field .problems { flex-basis: 100%; padding-left: 5.25rem; }
  .open > .problems { margin: .6rem 0 0 2.25rem; }
  .chip { min-height: 2.75rem; border: 1px solid var(--line); border-radius: 8px; padding: .45rem .8rem; font-size: .95rem; text-align: left; }
  .chip.keep { color: var(--mist); }
  .actions { display: flex; flex-wrap: wrap; gap: 0 1.25rem; margin: .75rem 0 0 2.25rem; font-size: .95rem; }
  .actions button { min-height: 2.75rem; color: var(--mist); }
  .actions .up, .actions .down { min-width: 2.75rem; font-size: 1.15rem; }  /* Touch-Ziel trotz schmalem Zeichen */
  .actions button:disabled { color: var(--line); }
  .actions .try { color: var(--lamp); }
  .actions .del { color: var(--warn); }
  #addMoment { font-size: 1.05rem; color: var(--mist); padding: 1rem 0; }
  @media (max-width: 30rem) {         /* iPhone: ohne Einzug, damit die Felder Platz haben */
    .field, .actions, .open > .problems { margin-left: 0; }
    .field .problems { padding-left: 0; }
  }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(1.25rem + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 2rem);
    display: flex; align-items: center; gap: 1rem; padding: .6rem 1rem; font-size: .95rem;
    background: var(--dusk); border: 1px solid var(--line); border-radius: 10px;
  }
  #toast button { color: var(--lamp); }

  /* Auswahl für Licht und Klang */
  .overlay {
    position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start;
    padding: 4vh 1rem; background: rgba(8, 10, 18, .75);
  }
  .sheet {
    width: 100%; max-width: 34rem; max-height: 92vh; display: flex; flex-direction: column;
    padding: 1rem 1.25rem; background: var(--night); border: 1px solid var(--line); border-radius: 12px;
  }
  .sheetTop { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  #pickerDone { font-size: 1.05rem; padding: .25rem 0 .25rem .5rem; }
  #pickerSearch { margin: .75rem 0 .25rem; }
  #pickerFilter {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0 .75rem;
    margin: .25rem 0; font-size: .9rem; color: var(--mist);
  }
  #pickerFilter button { min-height: 2.75rem; color: var(--lamp); }
  #pickerList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pickerList h3 {
    margin: 1rem 0 .25rem; font-weight: 400; font-size: .8rem; letter-spacing: .06em;
    text-transform: uppercase; color: var(--mist);
  }
  #pickerList .hint { margin: 1rem 0; }
  .option {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; width: 100%;
    text-align: left; padding: .7rem .6rem; border-bottom: 1px solid var(--dusk);
  }
  .option.sel { background: var(--dusk); border-radius: 8px; }
  .option small { font-size: .85rem; color: var(--mist); white-space: nowrap; }
  .option.missing, .option.missing small { color: var(--warn); }
  #pinForm { max-width: 22rem; }
  #pinInput {
    margin: 1rem 0 .25rem; font-size: 2rem; letter-spacing: .6em; text-align: center;
    -webkit-text-security: disc;          /* verdeckt, ohne dass Safari ein Passwort speichern will */
  }
  #pickerDynamic { display: flex; align-items: center; gap: .6rem; padding-top: .75rem; font-size: .95rem; color: var(--mist); }
  /* Zeilen der Auswahl «Wann», die keine Liste sind: Seitenzahl und Position */
  .pickRow { display: flex; align-items: center; gap: .75rem; padding: .7rem .6rem; border-bottom: 1px solid var(--dusk); }
  .pickRow > span:first-child { min-width: 5rem; font-size: .9rem; color: var(--mist); }
  .pickRow input[type=number] { width: 6rem; }
  .pickRow input[type=range] { flex: 1; min-width: 8rem; height: 2.75rem; accent-color: var(--lamp); }
  .pickRow .pct { min-width: 3rem; text-align: right; font-size: .95rem; }

  /* Verbindung zur Vorlese-App */
  #roomDialog .sheet { max-width: 26rem; }
  #roomHint { margin: .75rem 0 0; }
  #roomCode {
    width: 100%; margin: 1rem 0 .25rem; font-size: 1.8rem; letter-spacing: .35em;
    text-align: center; text-transform: uppercase;
  }
  #roomList { max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #roomActions { display: flex; justify-content: flex-end; gap: 1.5rem; padding-top: .75rem; }
  #roomActions button { min-height: 2.75rem; font-size: 1.05rem; }
  #roomDisconnect { color: var(--warn); }

  /* Lesemodus */
  #stage { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  #top { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; color: var(--mist); }
  #top .title { flex: 1; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #top button { font-size: .95rem; color: var(--mist); padding: .5rem; }
  #top #sync.live { color: var(--lamp); }
  #top #sync.warn { color: var(--warn); }
  #next {
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding: 0 8vw; text-align: left; width: 100%;
  }
  #next .now { font-size: 1rem; color: var(--mist); margin-bottom: 1.5rem; min-height: 1.4em; }
  #next .label { font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1.1; font-weight: 600; }
  #next:active .label { color: var(--lamp-dim); }
  #next.done .label { color: var(--mist); font-weight: 400; }
  /* Zündschnur: Sie zeigt, dass dieser Moment auch ohne Tippen kommt (ADR 0009). */
  #fuseTrack { width: min(22rem, 60%); height: 3px; margin-top: 1.75rem; background: var(--dusk); border-radius: 2px; }
  #fuse { display: block; width: 0; height: 100%; background: var(--lamp-dim); border-radius: 2px; }
  #bottom { display: flex; align-items: center; gap: 1.25rem; padding: 1rem 1.25rem 1.5rem; }
  #back { font-size: 1.05rem; color: var(--mist); padding: .75rem 1rem .75rem 0; }
  #dots { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--dusk); }
  #dots span.past { background: var(--lamp-dim); }
  #dots span.current { background: var(--lamp); }
  #status { min-height: 1.3em; padding: 0 1.25rem .75rem; font-size: .85rem; color: var(--warn); }

  @media (prefers-reduced-motion: no-preference) {
    #next .label { transition: opacity .25s; }
    #next.turning .label { opacity: 0; }
  }
</style>
</head>
<body>

<main id="shelf">
  <h1>Welches Buch lesen wir?</h1>
  <div id="books"></div>
  <button id="addBook">+ Neues Buch</button>
  <button id="connectApp">Mit der Vorlese-App verbinden</button>
  <form id="newBookForm" hidden>
    <input id="newTitle" placeholder="Titel des Buchs" aria-label="Titel des neuen Buchs"
           autocomplete="off" enterkeyhint="done">
    <button id="createBook">Anlegen</button>
    <button id="cancelBook" type="button">Abbrechen</button>
    <p class="error" id="newBookError" role="status"></p>
  </form>
  <p class="hint" id="shelfHint"></p>
</main>

<main id="editor" hidden>
  <div id="edTop">
    <input id="edTitle" placeholder="Titel" aria-label="Titel des Buchs" autocomplete="off">
    <span id="edStatus" role="status"></span>
    <button id="edDone">Fertig</button>
  </div>
  <div id="edRoom">
    <span>Standardraum</span>
    <button class="chip" id="edRoomChip"></button>
  </div>
  <ul class="problems" id="bookProblems" data-cue="book" data-field="other"></ul>
  <ol id="moments"></ol>
  <button id="addMoment">+ Moment hinzufügen</button>
  <div id="toast" role="status" hidden><span id="toastText"></span><button id="undo">Rückgängig</button></div>
</main>

<div id="picker" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="sheetTop"><span id="pickerTitle"></span><button id="pickerDone">Fertig</button></div>
    <input id="pickerSearch" type="search" autocomplete="off" aria-label="Suchen">
    <p class="error" id="pickerStatus" role="status"></p>
    <p id="pickerFilter" role="status" hidden></p>
    <div id="pickerList"></div>
    <label id="pickerDynamic"><input type="checkbox" id="dynamic"> Dynamisch abspielen</label>
  </div>
</div>

<div id="pinDialog" class="overlay" hidden>
  <form class="sheet" id="pinForm" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <div class="sheetTop"><span id="pinTitle">PIN zum Bearbeiten</span><button type="button" id="pinCancel">Abbrechen</button></div>
    <input id="pinInput" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN, 6 Ziffern">
    <p class="error" id="pinError" role="status"></p>
  </form>
</div>

<div id="roomDialog" class="overlay" hidden>
  <form class="sheet" id="roomForm" role="dialog" aria-modal="true" aria-labelledby="roomTitle">
    <div class="sheetTop"><span id="roomTitle"></span><button type="button" id="roomCancel">Abbrechen</button></div>
    <p class="hint" id="roomHint"></p>
    <input id="roomCode" maxlength="6" autocomplete="off" autocapitalize="characters"
           spellcheck="false" aria-label="Lese-Code, 6 Zeichen">
    <p class="error" id="roomError" role="status"></p>
    <div id="roomList"></div>
    <div id="roomActions">
      <button type="button" id="roomDisconnect" hidden>Trennen</button>
      <button id="roomConnect">Verbinden</button>
    </div>
  </form>
</div>

<main id="stage" hidden>
  <div id="top">
    <span class="title" id="bookTitle"></span>
    <button id="sync">Vorlese-App</button>
    <button id="editBook">Bearbeiten</button>
    <button id="close">Andere Bücher</button>
  </div>
  <button id="next" aria-live="polite">
    <span class="now" id="now"></span>
    <span class="label" id="nextLabel"></span>
    <span id="fuseTrack" aria-hidden="true" hidden><span id="fuse"></span></span>
  </button>
  <div>
    <div id="status" role="status"></div>
    <div id="bottom">
      <button id="back">Zurück</button>
      <div id="dots" aria-hidden="true"></div>
    </div>
  </div>
</main>

<script>
const FADE = 2.5;          // Sekunden Überblendzeit für Klangteppiche
const LOOP_GAIN = 0.35;    // Klangteppiche liegen unter den Effekten
const $ = id => document.getElementById(id);

// ---------- Audio ----------
const audio = {
  ctx: null, buffers: {}, loop: null,   // loop = {name, src, gain}
  init() {
    if (!this.ctx) {
      // iOS: als Medienwiedergabe spielen, sonst schluckt der Stumm-Modus jeden Ton.
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // iOS meldet nach Sperre, Anruf oder App-Wechsel "interrupted" statt "suspended".
    if (this.ctx.state !== "running") this.ctx.resume().catch(() => {});
  },
  async load(names) {
    const missing = [];
    await Promise.all(names.filter(n => !this.buffers[n]).map(async n => {
      try {
        const r = await fetch("/sounds/" + encodeURIComponent(n));
        if (!r.ok) throw new Error(r.status);
        this.buffers[n] = await this.ctx.decodeAudioData(await r.arrayBuffer());
      } catch { missing.push(n); }
    }));
    return missing;
  },
  fadeOutLoop() {
    if (!this.loop) return;
    const { src, gain } = this.loop, t = this.ctx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.linearRampToValueAtTime(0, t + FADE);
    src.stop(t + FADE + 0.1);
    this.loop = null;
  },
  setLoop(name) {
    if (this.loop && this.loop.name === name) return;
    this.fadeOutLoop();
    if (!name || !this.buffers[name]) return;
    const src = this.ctx.createBufferSource(), gain = this.ctx.createGain();
    src.buffer = this.buffers[name]; src.loop = true;
    src.connect(gain).connect(this.ctx.destination);
    const t = this.ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(LOOP_GAIN, t + FADE);
    src.start();
    this.loop = { name, src, gain };
  },
  playOnce(name, level = 1) {
    if (!this.buffers[name]) return null;
    const src = this.ctx.createBufferSource(), gain = this.ctx.createGain();
    src.buffer = this.buffers[name];
    gain.gain.value = level;
    src.connect(gain).connect(this.ctx.destination);
    src.start();
    return src;                         // zum Stoppen der Hörprobe im Editor
  },
};

// ---------- Zustand ----------
let book = null, bookId = null, idx = -1;
// Bearbeiten auf diesem Gerät laut Server: ok, pin (PIN nötig), no_pin (nur am Mac)
// oder wrong_host (über diese Adresse nie)
let editAccess = "ok";
const canEdit = () => editAccess === "ok" || editAccess === "pin";
// Der eigene Header weist Anfragen fremder Webseiten ab (ADR 0006).
const EDIT_HEADERS = { "Content-Type": "application/json", "X-Vorlese-Board": "1" };

// Effektiver Zustand bis Cue i: letzte Szene, aktueller Loop.
// loop: Dateiname = wechseln, null = ausblenden, fehlt = beibehalten.
function effective(cues, i) {
  let scene = null, loop = null;
  for (let k = 0; k <= i; k++) {
    const c = cues[k];
    if (c.scene) scene = c.scene;
    if ("loop" in c) loop = c.loop;
  }
  return { scene, loop };
}

async function setScene(scene, report = status) {
  if (!scene) return;
  try {
    const r = await fetch("/api/scene", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(scene),
    });
    const j = await r.json();
    if (!r.ok) report(j.error || "Szene nicht gesetzt");
  } catch { report("Server nicht erreichbar"); }
}

function status(msg) { $("status").textContent = msg || ""; }

function render() {
  const cues = book.cues, cur = cues[idx], nxt = cues[idx + 1];
  $("now").textContent = cur ? "Jetzt: " + cur.label : "Bereit";
  $("nextLabel").textContent = nxt ? nxt.label : "Ende des Buchs";
  $("next").classList.toggle("done", !nxt);
  $("back").disabled = idx < 0;
  $("back").style.visibility = idx < 0 ? "hidden" : "visible";
  $("dots").innerHTML = cues.map((_, k) =>
    `<span class="${k < idx ? "past" : k === idx ? "current" : ""}"></span>`).join("");
  renderSync();
}

function turn() {
  const el = $("next");
  el.classList.add("turning");
  setTimeout(() => el.classList.remove("turning"), 250);
}

async function go(to, forward) {
  if (to < -1 || to >= book.cues.length) return;
  audio.init();
  status("");
  idx = to;
  turn(); render();
  if (idx < 0) { audio.fadeOutLoop(); return; }
  const cue = book.cues[idx];
  if (forward) {
    if (cue.oneshot) audio.playOnce(cue.oneshot);
    if (cue.scene) setScene(cue.scene);
    if ("loop" in cue) audio.setLoop(cue.loop);
  } else {
    // Rückwärts: Zustand von Cue idx wiederherstellen, ohne Einzeleffekte.
    const e = effective(book.cues, idx);
    setScene(e.scene);
    audio.setLoop(e.loop);
  }
  armFuse();
}

// ---------- Der Vorlese-App folgen (ADR 0008) ----------
// Die App veröffentlicht die aufgeschlagene Seite in einem Raum ihrer Datenbank.
// Das Board liest mit; es schreibt dort nie etwas hinein.
const DB = "https://super-vorlese-app-default-rtdb.europe-west1.firebasedatabase.app";
const CODE_RE = /^[A-HJ-NP-Z2-9]{6}$/;      // Alphabet der Lese-Codes der Vorlese-App
const CODE_STORE = "vorlese-codes";
// Lesetempo für Momente mitten auf einer Seite (ADR 0009)
const PACE_SAMPLES = 5, PACE_MIN = 15000, PACE_MAX = 240000, PACE_DEFAULT = 60000;

let room = null;    // {code, es, page, state, turns: [ms], pageStart, timer}

function savedCodes() {
  try { return JSON.parse(localStorage.getItem(CODE_STORE)) || {}; } catch { return {}; }
}

function rememberCode(id, code) {
  const all = savedCodes();
  if (code) all[id] = code; else delete all[id];
  try { localStorage.setItem(CODE_STORE, JSON.stringify(all)); } catch {}
}

const roomUrl = code => `${DB}/rooms/${encodeURIComponent(code)}.json`;

// Jedes Buch hat seinen eigenen Lese-Code; beim Öffnen gilt der des Buchs.
function applyBookRoom(id) {
  const code = savedCodes()[id];
  if (room && room.code === code) return;
  disconnectRoom();
  if (code) connectRoom(code, id);
}

function connectRoom(code, id) {
  disconnectRoom();
  // bookId merkt sich, zu welchem Buch der Code gehört: Der Editor hat kein offenes Buch.
  const r = room = { code, bookId: id, es: null, page: null, state: "wait",
                     turns: [], pageStart: 0, timer: null };
  const es = r.es = new EventSource(roomUrl(code));
  // put: der Stand dieses Pfads. patch: einzelne Felder davon. Alles andere im
  // Raum (Zeiger, Stimmungsrunde, Verbindungsaufbau) geht das Board nichts an.
  const handle = whole => e => {
    if (room !== r) return;
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.path === "/page") return setRoomPage(msg.data);
    if (msg.path !== "/") return;
    if (whole && msg.data === null) return roomGone();
    if (msg.data && typeof msg.data === "object") setRoomPage(msg.data.page);
  };
  es.addEventListener("put", handle(true));
  es.addEventListener("patch", handle(false));
  // Der Browser verbindet von selbst neu; bis dahin sagt die Leiste, dass es hakt.
  es.addEventListener("error", () => { if (room === r) { r.state = "lost"; renderSync(); } });
  es.addEventListener("open", () => { if (room === r) { r.state = "live"; renderSync(); } });
  rememberCode(id, code);
  renderSync();
}

function disconnectRoom(forget = false) {
  if (!room) return;
  clearTimeout(room.timer);
  room.es.close();
  if (forget) rememberCode(room.bookId, null);
  room = null;
  stopFuse();
  renderSync();
}

// Die Vorlese-App löscht einen Raum 45 Tage nach dem letzten Umblättern.
function roomGone() {
  disconnectRoom(true);
  const msg = "Dieser Lese-Code gilt nicht mehr. In der Vorlese-App einen neuen erstellen.";
  if (book) status(msg); else if (edit) edStatus(msg, true);
}

function setRoomPage(page) {
  if (typeof page !== "number" || !Number.isFinite(page)) return;
  if (page === room.page) return;
  // Nur das Weiterblättern um eine Seite misst das Lesetempo; ein Sprung nicht.
  if (page === room.page + 1 && room.pageStart) {
    room.turns.push(Date.now() - room.pageStart);
    if (room.turns.length > PACE_SAMPLES) room.turns.shift();
  }
  room.page = page;
  room.pageStart = Date.now();
  room.state = "live";
  if (book) goToPage(page); else renderSync();
}

// Umblättern heisst «ab hier lesen» beim Moment dieser Seite: Zustand herstellen,
// Einzeleffekte übersprungener Momente bleiben stumm (ADR 0008).
//
// Hat die aufgeschlagene Seite keinen eigenen Moment, gilt die Seite davor als
// ganz gelesen: Das Board rückt bis an deren letzten Moment. Sonst hinge eine
// Position dieser Seite (ADR 0009) weiter in der Luft und käme, gemessen ab der
// neuen Seite, verspätet — obwohl ein Umblättern sie verfallen lässt.
function goToPage(page) {
  const cues = book.cues;
  let to = -1, exact = false;
  for (let k = 0; k < cues.length; k++) {
    if (typeof cues[k].page !== "number" || cues[k].page > page) continue;
    to = k;
    exact = cues[k].page === page;
  }
  if (to >= 0 && !exact)
    while (to + 1 < cues.length && typeof cues[to + 1].page !== "number") to++;
  if (to === idx) { armFuse(); renderSync(); return; }
  // Der Einzeleffekt gehört zum Betreten der Seite; zurück bleibt er stumm (ADR 0003).
  const entry = exact && to > idx ? cues[to] : null;
  go(to, false);
  if (entry && entry.oneshot) audio.playOnce(entry.oneshot);
}

function renderSync() {
  const b = $("sync");
  b.hidden = !book;
  b.textContent = !room ? "Vorlese-App"
    : room.state === "lost" ? "Verbindung weg"
    : room.page === null ? "verbindet …"
    : "Seite " + room.page;
  b.className = !room ? "" : room.state === "lost" ? "warn" : room.page === null ? "" : "live";
}

// ---------- Momente mitten auf einer Seite (ADR 0009) ----------
// Der nächste Moment kommt beim Tippen oder zu seiner geschätzten Zeit — was
// zuerst eintritt. Ein Umblättern überschreibt beides.
function pace() {
  if (room.turns.length < 2) return PACE_DEFAULT;
  const sorted = [...room.turns].sort((a, b) => a - b), mid = sorted.length >> 1;
  const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  return Math.min(Math.max(median, PACE_MIN), PACE_MAX);
}

function armFuse() {
  if (room) { clearTimeout(room.timer); room.timer = null; }
  const next = book && room && room.page !== null ? book.cues[idx + 1] : null;
  const at = next && typeof next.at === "number" ? next.at : null;
  // Eine Position gilt nur auf ihrer eigenen Seite. Steht die App längst
  // woanders, wartet der Moment auf einen Tipp statt auf die falsche Uhr.
  if (at === null || !(at > 0 && at < 1) || pageBefore(book.cues, idx + 1) !== room.page)
    return stopFuse();
  const total = at * pace(), left = Math.max(total - (Date.now() - room.pageStart), 0);
  room.timer = setTimeout(() => { if (book && room) go(idx + 1, true); }, left);
  runFuse(1 - left / total, left);
}

function runFuse(from, ms) {
  const track = $("fuseTrack"), fuse = $("fuse");
  track.hidden = false;
  fuse.style.transition = "none";
  fuse.style.width = Math.min(Math.max(from, 0), 1) * 100 + "%";
  void fuse.offsetWidth;                   // Startbreite übernehmen, bevor sie wächst
  fuse.style.transition = `width ${ms}ms linear`;
  fuse.style.width = "100%";
}

function stopFuse() {
  $("fuseTrack").hidden = true;
  $("fuse").style.transition = "none";
  $("fuse").style.width = "0";
}

// ---------- Screens ----------
async function openBook(id) {
  audio.init();                       // erster Tipp entsperrt Audio auf iOS
  let r, j;
  try {
    r = await fetch("/api/books/" + encodeURIComponent(id));
    j = await r.json();
  } catch { $("shelfHint").textContent = "Server nicht erreichbar."; return false; }
  if (!r.ok) { $("shelfHint").textContent = j.error; return false; }
  startReading(id, j, -1);
  return true;
}

// Lesemodus starten. start >= 0 stellt Licht und Teppich so ein, wie sie nach
// diesem Moment wären (Probelesen aus dem Editor).
async function startReading(id, data, start) {
  book = data; bookId = id; idx = -1;
  const sounds = [...new Set(book.cues.flatMap(c => [c.loop, c.oneshot]).filter(Boolean))];
  $("bookTitle").textContent = book.title;
  $("shelf").hidden = true; $("editor").hidden = true; $("stage").hidden = false;
  applyBookRoom(id);                  // der gemerkte Lese-Code dieses Buchs
  render();
  if (start >= 0) go(start, false);
  const missing = await audio.load(sounds);
  if (book !== data) return;          // inzwischen geschlossen oder anderes Buch
  // Wurde vor Ende des Ladens weitergetippt, fehlt der Klangteppich noch.
  if (idx >= 0) audio.setLoop(effective(book.cues, idx).loop);
  if (missing.length) status("Fehlende Sounds: " + missing.join(", "));
  try { await navigator.wakeLock?.request("screen"); } catch {}
  $("next").focus();
}

function closeBook() {
  audio.fadeOutLoop();
  disconnectRoom();                   // der Code bleibt beim Buch gemerkt
  book = null; bookId = null;
  $("stage").hidden = true; $("shelf").hidden = false;
  loadShelf();                        // Buchdateien können sich inzwischen geändert haben
}

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// Ein Regaleintrag: Titel, Umfang und, falls vorhanden, die konkreten Probleme.
// Bücher, die sich nicht öffnen lassen, sind ausgegraut.
function shelfEntry(b) {
  const entry = document.createElement("div"), btn = document.createElement("button");
  const small = document.createElement("small");
  entry.className = "entry";
  btn.className = "book"; btn.dataset.id = b.id; btn.disabled = !!b.error;
  const problems = b.error ? [b.error] : b.problems;
  small.textContent = b.error ? "Lässt sich nicht öffnen"
    : plural(b.cues, "Moment", "Momente")
      + (problems.length ? " · " + plural(problems.length, "Problem", "Probleme") : "");
  btn.append(b.title, small);
  entry.append(btn);
  if (!b.error && canEdit()) {
    const editBtn = h("button", { className: "edit", textContent: "Bearbeiten" });
    editBtn.dataset.id = b.id;
    entry.append(editBtn);
  }
  if (problems.length) {
    const list = document.createElement("ul");
    list.className = "problems";
    list.append(...problems.map(p => Object.assign(document.createElement("li"), { textContent: p })));
    entry.append(list);
  }
  return entry;
}

let shelfRequest = 0;
let shelfBooks = [];                        // letzter Stand des Regals, für die Suche per Lese-Code
async function loadShelf() {
  const request = ++shelfRequest;
  try {
    const j = await (await fetch("/api/books")).json();
    if (request !== shelfRequest) return;   // eine neuere Anfrage läuft schon
    setEditAccess(j.edit);
    shelfBooks = j.books;
    $("books").replaceChildren(...j.books.map(shelfEntry));
    $("shelfHint").textContent = [
      !j.books.length && (canEdit() ? "Noch keine Bücher. Leg mit «Neues Buch» das erste an." : "Noch keine Bücher."),
      !j.lights ? "Licht im Trockenmodus: Szenen werden nur im Terminal angezeigt und nicht geprüft."
        : j.bridge_error && "Szenen nicht geprüft. " + j.bridge_error,
      editAccess === "no_pin" && "Bearbeiten geht auf diesem Gerät erst, wenn am Mac eine PIN gesetzt ist: python3 server.py --pin",
      editAccess === "wrong_host" && `Bearbeiten geht nur über den .local-Namen des Macs oder seine IP-Adresse, nicht über «${location.hostname}». Den .local-Namen zeigt der Mac unter Systemeinstellungen > Allgemein > Freigaben.`,
    ].filter(Boolean).join(" ");
  } catch {
    if (request === shelfRequest) $("shelfHint").textContent = "Server nicht erreichbar.";
  }
}

// ---------- Lese-Code eingeben ----------
// Wer vor dem Board steht, hat sechs Ziffern und sonst nichts: Der Code sucht
// das Buch, nicht umgekehrt (ADR 0008).
let roomCtx = null;    // {bookId, code, hash, title}, solange der Dialog offen ist

function openRoomDialog(forBook = null) {
  roomCtx = { bookId: forBook, code: null, hash: null, title: null, busy: false };
  $("roomCode").value = "";
  $("roomError").textContent = "";
  $("roomList").replaceChildren();
  $("roomConnect").disabled = false;      // eine alte Anfrage darf den neuen Dialog nicht sperren
  $("roomConnect").textContent = "Verbinden";
  $("roomDialog").hidden = false;
  renderRoomDialog();
  if (!room) $("roomCode").focus();
}

function closeRoomDialog() {
  roomCtx = null;
  $("roomDialog").hidden = true;
}

function renderRoomDialog() {
  const connected = !!room;
  $("roomTitle").textContent = connected ? "Vorlese-App" : "Mit der Vorlese-App verbinden";
  $("roomHint").textContent = connected
    ? `Verbunden mit dem Lese-Code ${room.code}. ` + (room.page === null
        ? "Sobald jemand umblättert, folgt das Board."
        : `Die App ist auf Seite ${room.page}.`)
    : "Den Lese-Code zeigt die Vorlese-App unter «Gemeinsam lesen». "
      + "Das Board liest nur mit und blättert dort nie selbst.";
  $("roomCode").hidden = connected;
  $("roomConnect").hidden = connected;
  $("roomDisconnect").hidden = !connected;
}

async function submitRoom() {
  const ctx = roomCtx;
  if (!ctx || ctx.busy) return;             // die Eingabetaste kommt auch am gesperrten Knopf vorbei
  const code = $("roomCode").value.trim().toUpperCase();
  if (!CODE_RE.test(code)) {
    $("roomError").textContent = "Sechs Zeichen, genau wie in der Vorlese-App.";
    return;
  }
  ctx.busy = true;
  $("roomConnect").disabled = true;
  $("roomConnect").textContent = "Sucht …";
  let data;
  try {
    const r = await fetch(roomUrl(code));
    data = r.ok ? await r.json() : undefined;    // nicht ok: wie nicht erreichbar behandeln
  } catch { data = undefined; }
  // Der Dialog ist inzwischen geschlossen oder neu geöffnet: Diese Antwort
  // gehört zu einer anderen Frage und darf den neuen Dialog nicht anfassen.
  if (roomCtx !== ctx) return;
  ctx.busy = false;
  $("roomConnect").disabled = false;
  $("roomConnect").textContent = "Verbinden";
  if (data === undefined) {
    $("roomError").textContent = "Die Vorlese-App ist nicht erreichbar. Hat dieses Gerät Internet?";
    return;
  }
  if (!data) {
    $("roomError").textContent = "Diesen Lese-Code gibt es nicht. In der Vorlese-App einen neuen erstellen.";
    return;
  }
  ctx.code = code;
  ctx.hash = typeof data.book?.hash === "string" ? data.book.hash : null;
  ctx.title = typeof data.book?.title === "string" ? data.book.title : null;
  if (ctx.bookId) return startWithRoom(ctx.bookId);
  const match = ctx.hash && shelfBooks.find(b => !b.error && b.hash === ctx.hash);
  if (match) return startWithRoom(match.id);
  renderRoomChoice();
}

// Der Code nennt ein Buch, das noch zu keinem Buch im Regal gehört.
function renderRoomChoice() {
  $("roomError").textContent = "";
  $("roomHint").textContent = roomCtx.title
    ? `Der Code gehört zu «${roomCtx.title}». Welches Buch im Regal ist das?`
    : "Welches Buch im Regal gehört zu diesem Code?";
  $("roomCode").hidden = true;
  $("roomConnect").hidden = true;
  const usable = shelfBooks.filter(b => !b.error);
  $("roomList").replaceChildren(...(usable.length
    ? usable.map(b => h("button", { type: "button", className: "option",
        onclick: () => startWithRoom(b.id) },
        h("span", { textContent: b.title }),
        h("small", { textContent: b.pages ? "mit Seitenzahlen" : "ohne Seitenzahlen" })))
    : [h("p", { className: "hint", textContent: "Im Regal steht noch kein Buch." })]));
}

async function startWithRoom(id) {
  const { code, hash } = roomCtx;
  closeRoomDialog();
  rememberCode(id, code);
  if (bookId === id) connectRoom(code, id);          // offenes Buch: nur die Verbindung wechseln
  else if (!(await openBook(id))) return;            // öffnen; applyBookRoom verbindet dabei
  pairBook(id, hash);
  if (book && !book.cues.some(c => typeof c.page === "number"))
    status("Dieses Buch hat noch keine Seitenzahlen. Im Editor bei «Wann» zuordnen.");
}

// Merkt sich im Buch, zu welchem Buch der Vorlese-App es gehört: Dann findet ein
// Lese-Code das Buch von selbst wieder. Ohne Schreibrecht bleibt es beim
// gemerkten Code, deshalb fragt das hier nie nach der PIN.
async function pairBook(id, hash) {
  if (!hash || editAccess !== "ok") return;
  try {
    const r = await fetch(`/api/books/${encodeURIComponent(id)}/edit`, { headers: EDIT_HEADERS });
    if (!r.ok) return;
    const j = await r.json();
    if (j.book.sync?.hash === hash) return;
    j.book.sync = { hash };
    await fetch(`/api/books/${encodeURIComponent(id)}`, {
      method: "PUT", headers: EDIT_HEADERS,
      body: JSON.stringify({ version: j.version, book: j.book }),
    });
  } catch {}
}

$("connectApp").addEventListener("click", () => openRoomDialog(null));
$("sync").addEventListener("click", () => openRoomDialog(bookId));
$("roomForm").addEventListener("submit", e => { e.preventDefault(); submitRoom(); });
$("roomCancel").addEventListener("click", closeRoomDialog);
$("roomDisconnect").addEventListener("click", () => { disconnectRoom(true); closeRoomDialog(); });
$("roomDialog").addEventListener("click", e => { if (e.target === $("roomDialog")) closeRoomDialog(); });
$("roomCode").addEventListener("input", () => {
  $("roomCode").value = $("roomCode").value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, "").slice(0, 6);
  $("roomError").textContent = "";
});

// ---------- Editor ----------
// Jede Änderung wird sofort gespeichert (ADR 0006). version ist der Dateistand,
// den der Editor kennt; wurde die Datei inzwischen anders geändert, lehnt der Server ab.
let edit = null;     // {id, book, version, problems, open, dirty, saving, timer, conflict, deleted}
let picker = null;   // {i, field, items, error, playing, preview, all, justSet}
let toastTimer = null;

function h(tag, props = {}, ...children) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
}

async function openEditor(id, open = -1, focus = null) {
  let r, j;
  try {
    r = await fetch(`/api/books/${encodeURIComponent(id)}/edit`, { headers: EDIT_HEADERS });
    j = await r.json();
  } catch { return "Server nicht erreichbar"; }
  if (r.status === 401) {                 // Sitzung abgelaufen, etwa nach Neustart des Servers
    editAccess = "pin";
    return (await askPin()) ? openEditor(id, open, focus) : null;
  }
  if (!r.ok) return j.error;
  if (book) { audio.fadeOutLoop(); book = null; bookId = null; }
  closePicker(false);
  hideToast();
  edit = { id, book: j.book, version: j.version, problems: j.problems, open,
           dirty: false, saving: null, timer: null, conflict: false, deleted: null };
  $("edTitle").value = edit.book.title ?? "";
  applyBookRoom(id);                  // damit «Wann» die Seite der Vorlese-App kennt
  renderRoom();
  edStatus("");
  $("shelf").hidden = true; $("stage").hidden = true; $("editor").hidden = false;
  renderEditor(focus);
  return null;
}

async function leaveEditor() {
  // Nach einem Konflikt gilt der Stand der Datei; sonst erst gehen, wenn alles gespeichert ist.
  if (!(await save()) && !edit.conflict) return;
  closePicker(false);
  hideToast();
  edit = null;
  disconnectRoom();                   // der Code bleibt beim Buch gemerkt
  $("editor").hidden = true; $("shelf").hidden = false;
  loadShelf();
}

async function rehearse(i) {
  audio.init();                       // noch in der Tipp-Geste, für iOS
  if (!(await save())) return;
  const e = edit;
  closePicker(false);
  hideToast();
  edit = null;
  startReading(e.id, e.book, i - 1);
}

function edStatus(text, warn = false, action = null) {
  const s = $("edStatus");
  s.textContent = text;
  s.classList.toggle("warn", warn);
  if (action) s.append(h("button", { textContent: action.label, onclick: action.run }));
}

function changed(delay = 0) {
  edit.dirty = true;
  if (!edit.conflict) edStatus("Speichert …");
  clearTimeout(edit.timer);
  edit.timer = setTimeout(save, delay);
}

// Liefert true, sobald alles gespeichert ist. Läuft schon ein Speichern, wird
// dessen Schleife genutzt: Sie sendet so lange, bis nichts mehr offen ist.
function save() {
  const e = edit;
  clearTimeout(e.timer);
  if (!e.saving) e.saving = saveLoop(e).finally(() => { e.saving = null; });
  return e.saving;
}

async function saveLoop(e) {
  const retry = { label: "Erneut versuchen", run: save };
  const report = (...args) => { if (e === edit) edStatus(...args); };
  while (e.dirty && !e.conflict) {
    e.dirty = false;
    let r, j;
    try {
      r = await fetch(`/api/books/${encodeURIComponent(e.id)}`, {
        method: "PUT", headers: EDIT_HEADERS,
        body: JSON.stringify({ version: e.version, book: e.book }),
      });
      j = await r.json();
    } catch {
      e.dirty = true;
      report("Nicht gespeichert: Server nicht erreichbar.", true, retry);
      return false;
    }
    if (r.status === 401) {
      e.dirty = true;
      if (await askPin()) continue;
      report("Nicht gespeichert: Ohne PIN lässt sich nichts ändern.", true, retry);
      return false;
    }
    if (r.status === 409) {
      e.conflict = true;
      report(j.error + ". Deine letzten Änderungen sind nicht gespeichert.", true, {
        label: "Neu laden",
        run: async () => { const error = await openEditor(e.id, e.open); if (error) edStatus(error, true); },
      });
      return false;
    }
    if (!r.ok) {
      e.dirty = true;
      report("Nicht gespeichert: " + j.error, true, retry);
      return false;
    }
    e.version = j.version;
    e.problems = j.problems;
    if (e === edit && !e.dirty) renderProblems();   // sonst passt die Nummerierung erst nach dem nächsten Speichern
  }
  if (e.conflict) return false;
  report("Gespeichert");
  return true;
}

const FIELDS = [["when", "Wann"], ["scene", "Licht"], ["loop", "Teppich"], ["oneshot", "Effekt"]];

// «Wann» steht nur dort, wo es etwas zu entscheiden gibt: in einem Buch mit
// Seitenzahlen oder solange die Vorlese-App verbunden ist.
const usesPages = () => edit.book.cues.some(c => "page" in c || "at" in c);

// Seitenzahl, die vor Moment i zuletzt genannt wurde; null, wenn es keine gibt.
function pageBefore(cues, i) {
  for (let k = i - 1; k >= 0; k--) if (typeof cues[k].page === "number") return cues[k].page;
  return null;
}

const percent = at => Math.round(at * 100) + " %";

function sceneText(s) {
  return [s.name, s.room, s.dynamic && "dynamisch"].filter(Boolean).join(" · ") || "ungültige Szene";
}

const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();

// Standardraum des Buchs: Er filtert nur die Auswahl «Licht»; die Momente
// behalten ihren eigenen Raum in scene.room. Von Hand verfälschte Werte gelten
// als «nicht gesetzt»; das Regal meldet sie als Problem.
const bookRoom = () => typeof edit.book.room === "string" ? edit.book.room.trim() : "";

function renderRoom() {
  const room = bookRoom();
  $("edRoomChip").textContent = room || "Alle Räume";
  $("edRoomChip").classList.toggle("keep", !room);
}

// Text im Feld; «unverändert» und «läuft weiter» nennen, was vom Moment davor weiterwirkt.
function fieldText(i, field) {
  const cues = edit.book.cues, cue = cues[i], before = effective(cues, i - 1);
  if (field === "when") {
    if (typeof cue.page === "number") return { text: "Seite " + cue.page };
    if (typeof cue.at === "number") {
      const page = pageBefore(cues, i);
      return { text: (page === null ? "ohne Seite" : "Seite " + page) + ", bei " + percent(cue.at) };
    }
    return { text: "beim Tippen", keep: true };
  }
  if (field === "scene") {
    if (cue.scene) return { text: sceneText(cue.scene) };
    return { text: before.scene ? `unverändert (${before.scene.name})` : "unverändert", keep: true };
  }
  if (field === "loop") {
    if (!("loop" in cue)) return { text: before.loop ? `läuft weiter (${before.loop})` : "keiner", keep: true };
    return { text: cue.loop === null ? "ausblenden" : `wechselt zu ${cue.loop}` };
  }
  return cue.oneshot ? { text: cue.oneshot } : { text: "keiner", keep: true };
}

function summary(cue) {
  const parts = [];
  if (typeof cue.page === "number") parts.push("Seite " + cue.page);
  else if (typeof cue.at === "number") parts.push("bei " + percent(cue.at) + " der Seite");
  if (cue.scene) parts.push(sceneText(cue.scene));
  if ("loop" in cue) parts.push(cue.loop === null ? "Teppich aus" : "Teppich " + cue.loop);
  if (cue.oneshot) parts.push("Effekt " + cue.oneshot);
  return parts.join(" — ") || "Kein Licht- oder Klangwechsel";
}

const hasLabel = cue => typeof cue.label === "string" && cue.label.trim() !== "";
const momentName = (cue, i) => hasLabel(cue) ? `«${cue.label}»` : `Moment ${i + 1}`;

// Platzhalter, den renderProblems() mit den Problemen zu Moment i und Feld füllt.
function problemSlot(i, field, tag = "ul") {
  const slot = h(tag, { className: tag === "ul" ? "problems" : "count" });
  slot.dataset.cue = i;
  slot.dataset.field = field;
  return slot;
}

function renderEditor(focus = null) {
  const cues = edit.book.cues;
  $("moments").replaceChildren(...cues.map((cue, i) =>
    i === edit.open ? openMoment(cue, i) : closedMoment(cue, i)));
  renderProblems();
  const open = $("moments").children[edit.open];
  if (open) {
    open.scrollIntoView({ block: "nearest" });
    if (focus) open.querySelector(focus)?.focus();
  }
}

function closedMoment(cue, i) {
  const head = h("button", { className: "head", onclick: () => { edit.open = i; renderEditor(); } },
    h("span", { className: "num", textContent: i + 1 }),
    h("span", { className: "text" },
      hasLabel(cue) ? cue.label : h("span", { className: "unnamed", textContent: "Ohne Bezeichnung" }),
      h("small", {}, summary(cue), problemSlot(i, "count", "span"))));
  return h("li", { className: "moment" }, head);
}

function openMoment(cue, i) {
  const last = edit.book.cues.length - 1;
  const input = h("input", { className: "labelInput", value: cue.label ?? "",
    placeholder: "Bezeichnung des Moments", autocomplete: "off", enterKeyHint: "next" });
  input.setAttribute("aria-label", `Bezeichnung von Moment ${i + 1}`);
  const markEmpty = () => input.classList.toggle("empty", !input.value.trim());
  markEmpty();
  input.addEventListener("input", () => { cue.label = input.value; markEmpty(); changed(600); });
  // Enter legt den nächsten Moment an: So lässt sich erst das Gerüst des Buchs tippen.
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); insertMoment(i + 1); }
  });
  const fields = FIELDS.filter(([field]) => field !== "when" || usesPages() || room).map(([field, name]) => {
    const t = fieldText(i, field);
    const chip = h("button", { className: "chip" + (t.keep ? " keep" : ""), textContent: t.text,
                               onclick: () => openPicker(i, field) });
    chip.dataset.field = field;
    return h("div", { className: "field" }, h("span", { textContent: name }), chip, problemSlot(i, field));
  });
  const action = (text, className, onclick, disabled = false, label = null) => {
    const b = h("button", { textContent: text, className, onclick, disabled });
    if (label) b.setAttribute("aria-label", label);
    return b;
  };
  return h("li", { className: "moment open" },
    h("div", { className: "labelRow" }, h("span", { className: "num", textContent: i + 1 }), input),
    ...fields,
    problemSlot(i, "other"),
    h("div", { className: "actions" },
      action("Ab hier probelesen", "try", () => rehearse(i)),
      action("↑", "up", () => moveMoment(i, -1), i === 0, "Nach oben"),
      action("↓", "down", () => moveMoment(i, 1), i === last, "Nach unten"),
      action("+ Moment danach", "", () => insertMoment(i + 1)),
      action("Löschen", "del", () => deleteMoment(i))));
}

// Probleme an die Stelle, an der man sie beheben kann. Eine fehlende Bezeichnung
// zeigt das leere Feld selbst.
function renderProblems() {
  const own = ["label", "when", "scene", "loop", "oneshot"];
  document.querySelectorAll("#editor [data-field]:not(.chip)").forEach(slot => {
    const cue = slot.dataset.cue === "book" ? null : Number(slot.dataset.cue), f = slot.dataset.field;
    const found = edit.problems.filter(p => p.cue === cue && (
      f === "count" ? p.field !== "label" : f === "other" ? !own.includes(p.field) : p.field === f));
    if (f === "count") slot.textContent = found.length ? " · " + plural(found.length, "Problem", "Probleme") : "";
    else slot.replaceChildren(...found.map(p => h("li", { textContent: p.message })));
  });
}

// Bis die Antwort aufs nächste Speichern da ist, wandern die Probleme mit ihren Momenten.
function remapProblems(to) {
  edit.problems = edit.problems.flatMap(p => {
    if (p.cue === null) return [p];
    const k = to(p.cue);
    return k === null ? [] : [{ ...p, cue: k }];
  });
}

function insertMoment(at) {
  edit.book.cues.splice(at, 0, { label: "" });
  remapProblems(k => k >= at ? k + 1 : k);
  edit.open = at;
  changed();
  renderEditor(".labelInput");
}

function moveMoment(i, d) {
  const cues = edit.book.cues, j = i + d;
  [cues[i], cues[j]] = [cues[j], cues[i]];
  remapProblems(k => k === i ? j : k === j ? i : k);
  edit.open = j;
  changed();
  renderEditor(j === 0 ? ".down" : j === cues.length - 1 ? ".up" : d < 0 ? ".up" : ".down");
}

function deleteMoment(i) {
  const [cue] = edit.book.cues.splice(i, 1);
  const problems = edit.problems.filter(p => p.cue === i);
  remapProblems(k => k === i ? null : k > i ? k - 1 : k);
  edit.open = -1;
  changed();
  renderEditor();
  showToast(`${hasLabel(cue) ? `Moment «${cue.label}»` : `Moment ${i + 1}`} gelöscht`);
  edit.deleted = { cue, at: i, problems };
}

function undoDelete() {
  const d = edit.deleted;
  if (!d) return;
  hideToast();
  edit.book.cues.splice(d.at, 0, d.cue);
  remapProblems(k => k >= d.at ? k + 1 : k);
  edit.problems.push(...d.problems);
  edit.open = d.at;
  changed();
  renderEditor();
}

function showToast(text) {
  $("toastText").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 8000);
}

function hideToast() {
  clearTimeout(toastTimer);
  $("toast").hidden = true;
  if (edit) edit.deleted = null;
}

// ---------- Auswahl: Tippen wählt aus und probiert aus ----------
// field «room» wählt den Standardraum des Buchs, die übrigen ein Feld von Moment i.
async function openPicker(i, field) {
  const light = field === "scene" || field === "room";
  const p = picker = { i, field, items: null, error: null, playing: null, preview: null,
                       all: !bookRoom(), justSet: null };
  $("pickerTitle").textContent = field === "room" ? "Standardraum des Buchs"
    : `${{ when: "Wann", scene: "Licht", loop: "Teppich", oneshot: "Effekt" }[field]} für ${momentName(edit.book.cues[i], i)}`;
  $("pickerSearch").value = "";
  $("pickerSearch").placeholder =
    { scene: "Szene oder Raum suchen", room: "Raum suchen" }[field] || "Sound suchen";
  $("pickerSearch").hidden = field === "when";        // hier gibt es nichts zu durchsuchen
  $("pickerDynamic").hidden = field !== "scene";
  $("pickerFilter").hidden = true;
  $("pickerStatus").textContent = "";
  $("picker").hidden = false;
  renderPicker();
  if (field === "when") return;                       // die Antworten stehen schon im Buch
  try {
    const j = await (await fetch(light ? "/api/scenes" : "/api/sounds")).json();
    if (picker !== p) return;
    p.items = !light ? j.sounds
      : field === "scene" ? j.scenes
      : [...new Set(j.scenes.map(s => s.room))];     // /api/scenes liefert nach Raum sortiert
    if (light && !j.lights) p.error = field === "room"
      ? "Trockenmodus: Ohne Bridge sind keine Räume bekannt."
      : "Trockenmodus: Ohne Bridge lassen sich keine Szenen auswählen.";
    else if (light) p.error = j.error;
  } catch {
    if (picker !== p) return;
    p.items = [];
    p.error = "Server nicht erreichbar";
  }
  $("pickerStatus").textContent = p.error || "";
  renderPicker();
}

function closePicker(rerender = true) {
  if (!picker) return;
  const field = picker.field;
  stopPreview();
  picker = null;
  $("picker").hidden = true;
  if (!rerender || !edit) return;
  renderEditor(field === "room" ? null : `.chip[data-field=${field}]`);
  if (field === "room") $("edRoomChip").focus();
}

function renderPicker() {
  const { i, field, items } = picker, cue = field === "room" ? null : edit.book.cues[i];
  const q = $("pickerSearch").value.trim().toLowerCase();
  const rows = [];
  const option = (text, note, selected, onclick, missing = false) => {
    const b = h("button", { className: "option" + (selected ? " sel" : "") + (missing ? " missing" : ""), onclick },
      h("span", { textContent: text }), h("small", { textContent: note }));
    b.setAttribute("aria-pressed", selected);
    rows.push(b);
  };
  const heading = text => rows.push(h("h3", { textContent: text }));
  const hint = text => rows.push(h("p", { className: "hint", textContent: text }));

  if (field === "when") {
    const before = pageBefore(edit.book.cues, i);
    const at = typeof cue.at === "number" ? cue.at : null;
    const page = typeof cue.page === "number" ? cue.page : null;
    const live = room && room.page !== null ? room.page : null;
    option("Beim Tippen", "ohne Seite", page === null && at === null, () => pickWhen({}));
    heading("Zu Beginn einer Seite");
    // Die gewählte Seite bleibt sichtbar, auch wenn die App gerade woanders steht.
    if (page !== null && page !== live)
      option("Seite " + page, "✓ gewählt", true, () => pickWhen({ page }));
    if (live !== null)
      option("Seite " + live, page === live ? "✓ gewählt, dort ist die Vorlese-App" : "dort ist die Vorlese-App gerade",
             page === live, () => pickWhen({ page: live }));
    else
      hint("Ist das Buch mit der Vorlese-App verbunden, steht hier die Seite, die sie gerade zeigt.");
    rows.push(pageRow(cue));
    if (before === null) {
      hint("Ein Moment mitten auf der Seite braucht davor einen Moment mit Seitenzahl.");
    } else {
      heading("Mitten auf der Seite");
      const pct = Math.round((at ?? 0.5) * 100);
      option(`Auf Seite ${before}`, "bei " + pct + " %", at !== null, () => pickWhen({ at: pct / 100 }));
      rows.push(atRow(before, pct));
    }
  } else if (field === "room") {
    const cur = bookRoom();
    option("Alle Räume", "keine Vorauswahl", !cur, () => pickRoom(""));
    if (cur && items && !items.some(r => same(r, cur)))
      option(cur, "nicht auf der Bridge", true, () => {}, true);
    if (!items) hint("Lade Räume …");
    for (const r of (items || []).filter(r => !q || r.toLowerCase().includes(q)))
      option(r, same(r, cur) ? "✓ gewählt" : "", same(r, cur), () => pickRoom(r));
  } else if (field === "scene") {
    const cur = cue.scene, before = effective(edit.book.cues, i - 1).scene;
    const isCur = s => !!cur && same(s.name, cur.name) && (cur.room == null || same(s.room, cur.room));
    const matches = s => !q || `${s.name} ${s.room}`.toLowerCase().includes(q);
    const room = bookRoom();
    const inRoom = room ? (items || []).filter(s => same(s.room, room)) : [];
    // Der Filter greift nur, solange er etwas zeigt: Ein umbenannter Raum darf
    // die Auswahl nicht leeren.
    const filtered = !!room && !picker.all && inRoom.length > 0;
    renderFilterLine(items?.length ? room : "", inRoom.length, filtered);
    $("pickerSearch").placeholder = filtered ? "Szene suchen" : "Szene oder Raum suchen";
    const shown = (filtered ? inRoom : items || []).filter(matches);
    const hit = cur && items ? items.find(isCur) : null;
    option("Kein Lichtwechsel", before ? `bleibt ${before.name}` : "", !cur, () => pickScene(null));
    // Was der Moment schaltet, bleibt sichtbar, auch wenn Filter oder Suche es ausblenden.
    if (cur && items && !shown.some(isCur))
      option(sceneText(cur), hit ? "✓ gewählt" : "nicht auf der Bridge", true,
             hit ? () => pickScene(hit) : () => {}, !hit);
    if (!items) hint("Lade Szenen …");
    else if (filtered && !shown.length && items.some(matches))
      hint(`Keine Treffer in «${room}», aber ${plural(items.filter(matches).length,
        "in einem anderen Raum", "in anderen Räumen")}.`);
    let head = null;
    for (const s of shown) {
      if (!filtered && s.room !== head) heading(head = s.room);
      option(s.name, isCur(s) ? "✓ gewählt" : "", isCur(s), () => pickScene(s));
    }
    $("dynamic").checked = !!cur?.dynamic;
    $("dynamic").disabled = !cur;
  } else {
    const cur = cue[field];
    if (field === "loop") {
      const before = effective(edit.book.cues, i - 1).loop;
      option("Weiterlaufen lassen", before ? `(${before})` : "(es läuft keiner)", !("loop" in cue), () => pickSound(undefined));
      option("Ausblenden", "", cue.loop === null, () => pickSound(null));
      heading("Wechseln zu");
    } else {
      option("Kein Effekt", "", !cur, () => pickSound(undefined));
      heading("Abspielen");
    }
    if (typeof cur === "string" && items && !items.includes(cur)) option(cur, "fehlt im Ordner sounds", true, () => {}, true);
    if (!items) hint("Lade Sounds …");
    else if (!items.length) hint("Noch keine Sounds. Lege mp3-, m4a- oder wav-Dateien in den Ordner sounds.");
    for (const n of (items || []).filter(n => !q || n.toLowerCase().includes(q)))
      option(n, picker.playing === n ? "▶ spielt" : cur === n ? "✓ gewählt" : "", cur === n, () => pickSound(n));
  }
  $("pickerList").replaceChildren(...rows);
}

// Zeile unter der Suche: Sie nennt den gezeigten Ausschnitt und schaltet ihn um.
function renderFilterLine(room, inRoom, filtered) {
  const line = $("pickerFilter");
  line.hidden = !room;                 // erst, wenn es Szenen zu filtern gibt
  if (line.hidden) return line.replaceChildren();
  const text = !inRoom ? `Im Raum «${room}» gibt es keine Szenen.`
    : picker.justSet === room ? `Standardraum «${room}» gesetzt.`
    : filtered ? `Nur «${room}»` : "Alle Räume";
  line.replaceChildren(text);
  if (!inRoom) return;                 // ohne Szenen im Raum gibt es nichts umzuschalten
  line.append(h("button", {
    textContent: filtered ? "Alle Räume zeigen" : `Nur «${room}» zeigen`,
    onclick: () => { picker.all = filtered; picker.justSet = null; renderPicker(); },
  }));
}

// Seitenzahl von Hand, wenn die Vorlese-App gerade nicht verbunden ist.
function pageRow(cue) {
  const input = h("input", { type: "number", min: "0", step: "1", inputMode: "numeric",
    value: typeof cue.page === "number" ? cue.page : "", placeholder: "Seite" });
  input.setAttribute("aria-label", "Seitenzahl eingeben");
  input.addEventListener("change", () => {
    const n = parseInt(input.value, 10);
    if (Number.isInteger(n) && n >= 0) pickWhen({ page: n });
    else if (input.value.trim() === "" && typeof cue.page === "number") pickWhen({});
  });
  return h("div", { className: "pickRow" }, h("span", { textContent: "Seite" }), input);
}

// Position auf der Seite: Der Autor weiss, wo im Text der Moment sitzt, nicht,
// wie lange die Seite dauert (ADR 0009).
function atRow(page, pct) {
  const out = h("span", { className: "pct", textContent: pct + " %" });
  const slider = h("input", { type: "range", min: "5", max: "95", step: "5", value: String(pct) });
  slider.setAttribute("aria-label", `Position auf Seite ${page}, in Prozent`);
  slider.addEventListener("input", () => { out.textContent = slider.value + " %"; });
  slider.addEventListener("change", () => pickWhen({ at: Number(slider.value) / 100 }));
  return h("div", { className: "pickRow" }, h("span", { textContent: "Anfang — Ende" }), slider, out);
}

// Beides zusammen beantwortet «wann»: Seitenanfang, Position auf der Seite oder gar nichts.
function pickWhen(when) {
  const cue = edit.book.cues[picker.i];
  delete cue.page;
  delete cue.at;
  if ("page" in when) cue.page = when.page;
  if ("at" in when) cue.at = when.at;
  changed();
  renderPicker();
}

function pickScene(s) {
  const cue = edit.book.cues[picker.i];
  if (s) {
    cue.scene = { name: s.name, room: s.room };
    if ($("dynamic").checked) cue.scene.dynamic = true;
    // Die erste Szene des Buchs setzt den Standardraum: Von hier an startet die
    // Auswahl dort. Die offene Liste bleibt, wie sie ist, und sagt es nur.
    if (!bookRoom()) {
      edit.book.room = s.room;
      picker.all = true;
      picker.justSet = s.room;
      renderRoom();
    }
    previewScene(cue.scene);
  } else delete cue.scene;
  changed();
  renderPicker();
}

// "" = kein Standardraum; das Feld verschwindet dann aus der Buchdatei.
function pickRoom(room) {
  if (room) edit.book.room = room;
  else delete edit.book.room;
  changed();
  renderRoom();
  renderPicker();
}

function previewScene(scene) {
  $("pickerStatus").textContent = "";
  setScene(scene, msg => { if (picker) $("pickerStatus").textContent = msg; });
}

// name: Dateiname, null = ausblenden (nur Teppich), undefined = Feld entfernen.
function pickSound(name) {
  audio.init();                       // noch in der Tipp-Geste, für iOS
  const cue = edit.book.cues[picker.i];
  if (name === undefined) delete cue[picker.field];
  else cue[picker.field] = name;
  changed();
  if (typeof name === "string") togglePreview(name);
  else stopPreview();
  renderPicker();
}

// Hörprobe: einmal ganz abspielen, zweites Tippen stoppt.
async function togglePreview(name) {
  const p = picker;
  if (p.playing === name) return stopPreview();
  stopPreview();
  p.playing = name;
  const missing = await audio.load([name]);
  if (picker !== p || p.playing !== name) return;
  if (missing.length) {
    p.playing = null;
    $("pickerStatus").textContent = `«${name}» lässt sich nicht abspielen`;
  } else {
    // Die Probe klingt so laut wie später im Buch, Teppich also gedämpft.
    const src = p.preview = audio.playOnce(name, p.field === "loop" ? LOOP_GAIN : 1);
    src.onended = () => { if (p.preview === src) { p.playing = null; p.preview = null; if (picker === p) renderPicker(); } };
  }
  renderPicker();
}

function stopPreview() {
  if (!picker) return;
  const src = picker.preview;
  picker.playing = null;
  picker.preview = null;
  if (src) { src.onended = null; src.stop(); }
}

$("dynamic").addEventListener("change", () => {
  const cue = edit.book.cues[picker.i];
  if (!cue.scene) return;
  if ($("dynamic").checked) cue.scene.dynamic = true;
  else delete cue.scene.dynamic;
  changed();
  previewScene(cue.scene);
  renderPicker();
});
$("edRoomChip").addEventListener("click", () => openPicker(null, "room"));
$("pickerSearch").addEventListener("input", renderPicker);
$("pickerDone").addEventListener("click", () => closePicker());
$("picker").addEventListener("click", e => { if (e.target === $("picker")) closePicker(); });
$("edTitle").addEventListener("input", () => { edit.book.title = $("edTitle").value; changed(600); });
$("edDone").addEventListener("click", leaveEditor);
$("addMoment").addEventListener("click", () => insertMoment(edit.book.cues.length));
$("undo").addEventListener("click", undoDelete);

// ---------- PIN ----------
function setEditAccess(access) {
  editAccess = access;
  $("addBook").hidden = !canEdit() || !$("newBookForm").hidden;
  if (!canEdit()) $("newBookForm").hidden = true;
  $("editBook").hidden = !canEdit();
}

// Vor dem Bearbeiten: Braucht es eine PIN, öffnet der Dialog noch in der Tipp-Geste,
// damit iPad und iPhone gleich die Zahlentastatur zeigen.
async function withEditAccess(run) {
  if (editAccess === "pin" && !(await askPin())) return;
  run();
}

let pinPrompt = null;   // {promise, resolve}, solange der Dialog offen ist

function askPin() {
  if (pinPrompt) return pinPrompt.promise;
  let resolve;
  const promise = new Promise(r => { resolve = r; });
  pinPrompt = { promise, resolve };
  $("pinInput").value = "";
  $("pinError").textContent = "";
  $("pinDialog").hidden = false;
  $("pinInput").focus();
  return promise;
}

function closePin(ok) {
  if (!pinPrompt) return;
  const { resolve } = pinPrompt;
  pinPrompt = null;
  $("pinDialog").hidden = true;
  if (ok) editAccess = "ok";
  resolve(ok);
}

async function submitPin() {
  const pin = $("pinInput").value;
  if (!/^[0-9]{6}$/.test(pin)) { $("pinError").textContent = "6 Ziffern eingeben"; return; }
  $("pinInput").disabled = true;
  try {
    const r = await fetch("/api/pin", { method: "POST", headers: EDIT_HEADERS, body: JSON.stringify({ pin }) });
    const j = await r.json();
    if (r.ok) return closePin(true);
    $("pinError").textContent = j.error;
  } catch {
    $("pinError").textContent = "Server nicht erreichbar";
  } finally {
    $("pinInput").disabled = false;
  }
  $("pinInput").value = "";
  $("pinInput").focus();
}

$("pinInput").addEventListener("input", () => {
  const digits = $("pinInput").value.replace(/[^0-9]/g, "").slice(0, 6);
  $("pinInput").value = digits;
  $("pinError").textContent = "";
  if (digits.length === 6) submitPin();   // ohne Extra-Tipp auf «OK»
});
$("pinForm").addEventListener("submit", e => { e.preventDefault(); submitPin(); });
$("pinCancel").addEventListener("click", () => closePin(false));
$("pinDialog").addEventListener("click", e => { if (e.target === $("pinDialog")) closePin(false); });

// ---------- Neues Buch ----------
function closeNewBook() { $("newBookForm").hidden = true; $("addBook").hidden = false; }
$("addBook").addEventListener("click", () => withEditAccess(() => {
  $("addBook").hidden = true; $("newBookForm").hidden = false;
  $("newTitle").value = ""; $("newBookError").textContent = "";
  $("newTitle").focus();
}));
$("cancelBook").addEventListener("click", closeNewBook);
$("newTitle").addEventListener("input", () => { $("newBookError").textContent = ""; });
$("newBookForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("newTitle").value.trim();
  if (!title) { $("newBookError").textContent = "Titel eingeben"; return; }
  $("createBook").disabled = true;
  try {
    const create = () => fetch("/api/books", { method: "POST", headers: EDIT_HEADERS, body: JSON.stringify({ title }) });
    let r = await create();
    while (r.status === 401) {          // Sitzung abgelaufen, etwa nach Neustart des Servers
      editAccess = "pin";
      if (!(await askPin())) return;
      r = await create();
    }
    const j = await r.json();
    if (!r.ok) { $("newBookError").textContent = j.error; return; }
    closeNewBook();
    const error = await openEditor(j.id, 0, ".labelInput");
    if (error) $("shelfHint").textContent = error;
  } catch {
    $("newBookError").textContent = "Server nicht erreichbar";
  } finally {
    $("createBook").disabled = false;
  }
});

$("books").addEventListener("click", async e => {
  const editBtn = e.target.closest(".edit"), b = e.target.closest(".book");
  if (editBtn) {
    withEditAccess(async () => {
      const error = await openEditor(editBtn.dataset.id);
      if (error) $("shelfHint").textContent = error;
    });
  } else if (b) openBook(b.dataset.id);
});
$("next").addEventListener("click", () => go(idx + 1, true));
$("back").addEventListener("click", () => go(idx - 1, false));
$("close").addEventListener("click", closeBook);
// Bearbeiten beim Moment, bei dem man gerade ist
$("editBook").addEventListener("click", () => withEditAccess(async () => {
  const error = await openEditor(bookId, Math.min(Math.max(idx, 0), book.cues.length - 1));
  if (error) status(error);
}));
// Pfeiltasten: Bluetooth-Seitenwender und Tastaturen senden diese
document.addEventListener("keydown", e => {
  if (pinPrompt) { if (e.key === "Escape") closePin(false); return; }
  if (roomCtx) { if (e.key === "Escape") closeRoomDialog(); return; }
  if (picker && e.key === "Escape") { closePicker(); return; }
  if (!book) return;
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(idx + 1, true); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(idx - 1, false); }
});
// Zurück im Regal, etwa nach dem Bearbeiten einer Buchdatei am Mac: neu prüfen
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!$("shelf").hidden) loadShelf();
  // Im Hintergrund bremst der Browser Zeitgeber; die Zündschnur rechnet neu.
  if (book && room) armFuse();
});
loadShelf();
</script>
</body>
</html>
